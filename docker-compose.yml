services:
  turi-kout:
    build: .
    image: turi-kout
    restart: unless-stopped
    environment:
      # Laissez vide au premier demarrage : un jeton est genere et affiche dans
      # les journaux (docker compose logs turi-kout).
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      PORT: 8080
      DB_PATH: /data/turi-kout.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Caddy termine le TLS devant : on n'expose que sur la boucle locale.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - turi-kout-data:/data

volumes:
  turi-kout-data:
